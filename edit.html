<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Still | Edit post</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tsukimi+Rounded&display=swap"
      rel="stylesheet" />
    <link href="./src/output.css" rel="stylesheet" />
    <script type="module" src="./src/api/editPost.js" defer></script>
  </head>
  <body>
    <header id="desktop-header" class="desktop-header"></header>
    <section class="flex flex-col items-center gap-10 mx-auto max-w-100 mt-10">
      <h1 class="font-tsukimi text-3xl">Edit your post</h1>
      <form
        id="edit-form"
        class="flex flex-col items-center justify-items-center text-left gap-5 w-[40%]">
        <div class="flex flex-col items-center w-full">
          <label for="title" class="self-start">Title</label>
          <input
            name="title"
            id="title"
            required
            class="border rounded-sm pl-2 w-full" />
        </div>
        <div class="flex flex-col items-center w-full">
          <label for="url" class="self-start">Image URL</label>
          <input
            type="url"
            name="url"
            id="url"
            class="border rounded-sm pl-2 w-full" />
        </div>
        <div class="flex flex-col items-center w-full">
          <label for="body" class="self-start">Caption</label>
          <textarea
            name="body"
            id="body"
            cols="25"
            rows="5"
            class="border rounded-sm pl-2 w-full"></textarea>
        </div>
        <div class="flex flex-col items-center gap-30">
          <button
            class="border-2 px-4 py-2 hover:bg-black hover:text-white"
            type="submit">
            Save changes
          </button>
          <button
            id="delete-button"
            class="px-5 py-2 bg-amber-800 hover:bg-amber-700 active:bg-amber-950 text-white">
            Delete post
          </button>
        </div>
      </form>
    </section>
  </body>
</html>
