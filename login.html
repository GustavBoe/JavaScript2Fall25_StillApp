<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Still | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tsukimi+Rounded&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/css/style.css" />
   
    <script type="module" src="./src/api/login.js"></script>
  </head>
   <body class="min-vh-100 d-flex flex-column">
    <header>
      <nav
        id="header-nav"
        class="navbar navbar-expand-lg navbar-light bg-light"
      ></nav>
    </header>
    <h1 class="register-heading tsukimi-rounded-regular ">Log in</h1>
<form id="login-form">
  
  <label for="email">Email*</label>
  <input name="email" id="email" type="email" required class="create-title"/>
  
  <label for="password">Password*</label>
  <input type="password" name="password" id="password" required/>
  
  <button class="register-form-button">Log in</button>

</form>

</html>
