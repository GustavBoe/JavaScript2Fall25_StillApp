<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Still | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tsukimi+Rounded&display=swap" rel="stylesheet">
    <link href="./src/output.css" rel="stylesheet" />
   
    <script type="module" src="./src/api/login.js"></script>
  </head>
  <body>
    <header id="desktop-header" >
    </header>
    <section class="flex flex-col items-center gap-10 mx-auto mt-10 max-w-100">
      <h1 class="font-tsukimi text-3xl">Log in</h1>
  <form id="login-form" class="flex flex-col items-center justify-items-center text-left gap-5 w-[40%]">
    <div class="flex flex-col items-center w-full">
      <label for="email" class="self-start">Email</label>
      <input name="email" id="email" type="email" required class="border rounded-sm pl-2 w-full"/>
    </div>
    <div class="flex flex-col items-center w-full">
      <label for="password" class="self-start">Password</label>
      <input type="password" name="password" id="password" required class="border rounded-sm pl-2 w-full"/>
    </div>
    <button class="border-2 px-4 py-2 hover:bg-black hover:text-white">Log in</button>
  </form>
  <div class="flex flex-col items-center gap-3">
        <h2>Don´t have an account?</h2>
        <a
          href="./register.html"
          class="border-2 px-4 py-2 hover:bg-black hover:text-white"
          >Register</a
        >
      </div>
    </section>
    
</html>
