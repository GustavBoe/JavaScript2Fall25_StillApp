<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Still | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tsukimi+Rounded&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/css/style.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <script type="module" src="./src/api/login.js"></script>
  </head>
  <body class="min-vh-100 d-flex flex-column">
    <header>
      <nav
        id="header-nav"
        class="navbar navbar-expand-lg navbar-light bg-light"
      ></nav>
    </header>
    <main class="d-flex flex-column align-items-center">
      <h1 class="align-self-center my-5">Log in</h1>

      <form
        id="login-form"
        class="needs-validation container w-75 d-flex flex-column align-items-center"
      >
        <div class="mb-4 w-md-75">
          <label for="email" class="form-label">Email*</label>
          <input
            name="email"
            id="email"
            type="email"
            required
            class="form-control"
            placeholder="`@stud.noroff.com` here"
          />
          <div class="invalid-feedback">
            Please enter a valid "@stud.noroff.com" email
          </div>
        </div>

        <div class="mb-4 w-md-75">
          <label for="password" class="form-label">Password*</label>
          <input
            type="password"
            name="password"
            id="password"
            required
            class="form-control"
          />
          <div class="invalid-feedback">Please enter your password</div>
        </div>
        <button class="btn btn-outline-dark">Log in</button>
      </form>
    </main>
  </body>
</html>
