<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Still | Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tsukimi+Rounded&display=swap"
      rel="stylesheet" />
    <link href="./src/output.css" rel="stylesheet" />

    <script type="module" src="./src/api/authServices.js"></script>
  </head>
  <body>
    <header id="desktop-header" class="desktop-header"></header>
    <section class="flex flex-col items-center gap-10 max-w-100 mx-auto">
      <h1 class="font-tsukimi text-3xl">Create new account</h1>
      <form
        id="register-form"
        class="flex flex-col items-center justify-items-center text-left gap-5 w-[40%]">
        <div class="flex flex-col items-center w-full">
          <label for="name" class="self-start">Name</label>
          <input
            name="name"
            id="name"
            required
            class="border rounded-sm pl-2 w-full" />
        </div>
        <div class="flex flex-col items-center w-full">
          <label for="email" class="self-start">Email</label>
          <input
            name="email"
            id="email"
            type="email"
            required
            class="border rounded-sm pl-2 w-full" />
        </div>
        <div class="flex flex-col items-center w-full">
          <label for="password" class="self-start">Password</label>
          <input
            type="password"
            name="password"
            id="password"
            required
            class="border rounded-sm pl-2 w-full" />
        </div>
        <button class="border-2 px-4 py-2 hover:bg-black hover:text-white">
          Create account
        </button>
      </form>
      <div class="flex flex-col items-center gap-3">
        <h2>Already have an account?</h2>
        <a
          href="./login.html"
          class="border-2 px-4 py-2 hover:bg-black hover:text-white"
          >Login</a
        >
      </div>
    </section>
  </body>
</html>
